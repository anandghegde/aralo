[package]
name = "aralo-core"
description = "The facade the shells talk to: library, expansion sessions, settings and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aralo-ai = { workspace = true }
aralo-embed = { workspace = true }
aralo-engine = { workspace = true }
aralo-import = { workspace = true }
aralo-library = { workspace = true }
aralo-providers = { workspace = true }
aralo-snippet = { workspace = true }
aralo-template = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, features = ["display"] }
ulid = { workspace = true, features = ["std"] }
unicode-segmentation = { workspace = true }

# The system keychain on each platform: Keychain Services, the Windows
# Credential Manager, and the kernel keyring on Linux (no D-Bus to link).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }
[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
