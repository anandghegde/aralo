[package]
name = "aralo-engine"
description = "Aralo's keystroke matcher: a 64-character in-memory buffer and an abbreviation trie. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# PRIVACY INVARIANT (PRD P1). This crate sees keystrokes, so it is `no_std` and
# may depend on nothing that can read files, open sockets, read a clock or log.
# `scripts/check-deps.sh` fails CI if any crate outside its allow-list appears
# in this crate's normal dependency tree. Dev-dependencies are exempt.
[dependencies]
zeroize = { workspace = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "on_key"
harness = false

[lints]
workspace = true
