# The Xcode project is generated: `make bootstrap`, or `xcodegen` in this folder.
# Aralo.xcodeproj is not committed. Change this file, not the project.
name: Aralo
options:
  bundleIdPrefix: app.aralo
  deploymentTarget:
    macOS: "14.0" # Keep in step with scripts/build-xcframework.sh and the Swift packages.
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  AraloKit:
    path: Packages/AraloKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds are signed ad hoc. Release signing (Developer ID, notarised)
    # is set by the release workflow, not here.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Aralo:
    type: application
    platform: macOS
    sources:
      - path: Aralo
      # The embedding model search by meaning runs on (ADR-0016), fetched by
      # `make model`. A folder reference, so it lands in Resources as it is;
      # optional, so a project generated without it still builds and searches
      # by words alone.
      - path: ../../models/potion-base-8M
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: AraloKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aralo.Aralo
        GENERATE_INFOPLIST_FILE: YES
        # An agent app: a menu bar item and no Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aralo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0. Aralo contributors."

schemes:
  Aralo:
    build:
      targets:
        Aralo: all
    run:
      config: Debug
