# cargo-deny configuration (v2-style). Run locally with `cargo deny check`.
# CI runs it in the `graph` job of .github/workflows/check.yml.
#
# What this file is for (plan section 9, "Supply chain", and ADR-0008):
#   - every dependency's licence is compatible with shipping Aralo under Apache-2.0
#   - no dependency has a known security advisory
#   - every crate comes from crates.io
#   - HTTP client crates stay behind the network guard in `aralo-ai` (ADR-0007)
#
# The engine-purity and crate-layering rules are NOT here. cargo-deny cannot
# express "this one crate's dependency closure must be within an allow-list";
# scripts/check-deps.sh does that.

[graph]
# Only the targets Aralo builds for. Keeps licences and advisories of crates
# that are never compiled (other platforms' back ends) out of the result.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2
# Vulnerability and unsoundness advisories always fail the check in v2.
# A yanked crate fails too: a yank usually means a broken or unsafe release.
yanked = "deny"
# "Unmaintained" advisories fail for crates the workspace depends on directly,
# where we can act. For transitive crates they are reported upstream instead.
unmaintained = "workspace"
# Every entry needs the advisory ID, a reason and a date to look again.
ignore = []

[licenses]
version = 2
# Licences a dependency may carry. For an `A OR B` expression one allowed
# licence is enough. Anything not listed fails the check; add a licence only
# after reading it, and record why in the pull request.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # UniFFI (uniffi, uniffi_core, uniffi_bindgen, uniffi_macros, ...) and
    # nucleo-matcher are MPL-2.0. MPL is file-level copyleft: it covers changes
    # to those crates' own files, not code that links to them, so it is
    # compatible with shipping Aralo under Apache-2.0 as long as both are used
    # unmodified from crates.io.
    "MPL-2.0",
    # Public-domain dedications. Nothing in the tree needs them today (every
    # `Unlicense` crate is also offered under MIT). Uncomment when one does.
    # "CC0-1.0",
    # "Unlicense",
]
confidence-threshold = 0.9
# The allow-list is a policy, not a description of today's tree, so an entry
# that no crate uses yet is not worth a warning.
unused-allowed-license = "allow"
# Per-crate exceptions go here, each with a reason:
# exceptions = [{ crate = "some-crate", allow = ["Some-Licence"] }]
exceptions = [
    # `notify` is CC0-1.0 and offers nothing else, so it needs an exception
    # rather than the commented-out allow-list entry above. A public-domain
    # dedication imposes no condition on Aralo, and CC0's patent silence is not
    # a new risk here: the crate wraps FSEvents and inotify, which are the
    # platforms' own. Keeping this per-crate means the next CC0 dependency is
    # read on its own merits instead of arriving allowed (ADR-0008).
    { crate = "notify", allow = ["CC0-1.0"] },
    # Mozilla's root certificates as data, which rustls-platform-verifier
    # falls back on where the platform has no trust store of its own. The
    # CDLA-Permissive-2.0 licence covers data rather than code and asks only
    # that the licence text travel with it; it places no condition on the
    # code that loads it (ADR-0008).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# Workspace crates are `publish = false` and Apache-2.0; skip them.
ignore = true

[bans]
multiple-versions = "warn"
# A `*` version requirement is refused, except for path dependencies between
# workspace crates, which have no version.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Network guard rule (plan section 7.1 and 9, ADR-0007): the guard in
# `aralo-ai` is the only constructor of HTTP clients in the workspace, and
# there is one client type, reqwest with rustls.
#
# What cargo-deny can express of that rule: WHICH CRATES may depend on an HTTP
# client. `wrappers` lists the only crates allowed to have the banned crate as
# a direct dependency; any other direct dependent fails the check.
#
# What it cannot express: WHO CALLS `reqwest::Client::new` or
# `reqwest::Client::builder`. That is the clippy `disallowed-methods` lint the
# plan calls for. It does not exist yet; it lands with the guard in M4.
deny = [
    # Other HTTP clients: never, anywhere. One client type is what makes the
    # guard enforceable.
    { crate = "ureq", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    { crate = "isahc", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    { crate = "surf", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    { crate = "attohttpc", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    { crate = "minreq", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    { crate = "curl", reason = "HTTP goes through the network guard in aralo-ai, which uses reqwest (ADR-0007)" },
    # TLS: rustls only, so there is no OpenSSL to bundle, sign or notarise
    # (plan section 2, "HTTP and streaming").
    { crate = "openssl-sys", reason = "rustls only; no OpenSSL to bundle (plan section 2)" },
    { crate = "native-tls", reason = "rustls only; no OpenSSL to bundle (plan section 2)" },

    # The guard's own crate is the only one that may depend on reqwest (M4,
    # task 4.1). Inside aralo-ai, scripts/check-deps.sh keeps it to the guard
    # module, and clippy.toml bans building a client anywhere else.
    #
    # If the adapters in `aralo-providers` need reqwest's types, do not add
    # that crate to `wrappers` without a new ADR: it widens the set of crates
    # that can construct a client, which is the thing the guard exists to
    # prevent. They are given a `Transport` by the gateway instead.
    { crate = "reqwest", wrappers = ["aralo-ai"], reason = "only the network guard in aralo-ai may construct HTTP clients (ADR-0007)" },
]

# Duplicate versions we accept, each with a reason. Each names only the older
# major, so a third version still warns; drop an entry once the crates named in
# it move on and `cargo deny check bans` stops needing it.
skip = [
    # Proc-macro crates still on syn 2 while the rest of the tree is on syn 3:
    # uniffi's macros, jni-macros (under rustls-platform-verifier), the
    # windows-implement/-interface macros, zerocopy-derive and scroll_derive
    # (goblin, under uniffi_bindgen). Build-time only: syn is never linked
    # into the app or the CLI.
    { crate = "syn@2", reason = "proc macros of uniffi, jni, windows and zerocopy are not on syn 3 yet; build-time only" },
    # keyring 3.6 and notify 8.2 (notify's latest) want windows-sys 0.60; the
    # rest of the Windows tree is on 0.61. Windows builds only. keyring 4 is a
    # rewrite with a new API, not a bump.
    { crate = "windows-sys@0.60", reason = "keyring 3.6 and notify 8.2 are on 0.60; Windows builds only" },
    # rsqlite-vfs, the VFS of sqlite-wasm-rs that rusqlite 0.40 uses on
    # wasm32, is on hashbrown 0.16; indexmap and hashlink are on 0.17. Only
    # the wasm32 target builds it.
    { crate = "hashbrown@0.16", reason = "rusqlite's wasm32 VFS (rsqlite-vfs) is on 0.16; wasm32 only" },
]
skip-tree = []

[sources]
# crates.io only. No git dependencies and no alternative registries: both would
# bypass the licence and advisory data above.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
