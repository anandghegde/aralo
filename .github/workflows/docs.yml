# The documentation site (task 5.6): docs/ built with mdBook (book.toml), checked on
# every pull request that touches it, published to GitHub Pages from main.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, book.toml, README.md, CONTRIBUTING.md, SECURITY.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, book.toml, README.md, CONTRIBUTING.md, SECURITY.md, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Why: a broken link or include in the docs fails here, not on the published site.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: mdbook@0.5.4
      - name: Build the site
        run: mdbook build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: book

  # Why: only main is published. Needs Pages set to "GitHub Actions" in the repository's settings.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
