# The merge gate. Every job here must pass before a pull request merges.
# Actions are pinned by major tag. dtolnay/rust-toolchain has no version tags:
# its ref selects the toolchain (`@stable`), or `@master` plus a `toolchain` input.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Why: every crate and the CLI build and test on macOS, Linux and Windows from day one (plan section 10).
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Fixtures and golden files are compared byte for byte; keep Windows from rewriting line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The embedding model search by meaning ships with, for the tests that hold it to finding the refund
      # reply by what it means (crates/aralo-core/tests/meaning.rs). Linux only: the model is the same
      # bytes everywhere, and the other two run the rest of the suite.
      - name: Cache the embedding model
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - name: Fetch the embedding model
        if: matrix.os == 'ubuntu-latest'
        run: scripts/fetch-model.sh
      # Includes the privacy invariants (crates/aralo-engine/tests/privacy.rs): a privacy regression blocks merge.
      - name: Test
        run: cargo test --workspace
        env:
          # With the model fetched, the tests that need it must not skip.
          ARALO_REQUIRE_MODEL: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # What the model made of each query, every snippet's similarity printed, passing or not: a change
      # of model or of the bar is read here.
      - name: Search by meaning, with the scores
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p aralo-core --test meaning -- --nocapture --test-threads 1
        env:
          ARALO_REQUIRE_MODEL: "1"

  # Why: engine purity and the one-way crate graph are build properties, not promises (ADR-0005); cargo-deny covers licences, advisories and sources.
  graph:
    name: graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine purity, crate layering, no unsafe in aralo-ffi, silent engine, offline shell, no logs, hardened runtime
        run: scripts/check-deps.sh
      - name: Schemas are valid JSON
        run: |
          for schema in schemas/*.json; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$schema"
            echo "ok    $schema"
          done
      - name: cargo-deny (licences, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Why: PRD P13. The workspace's tests run with HOME, ARALO_STATE and TMPDIR in a scratch folder, and then no
  # file the run wrote may hold the canary key or anything shaped like a provider key (plan section 9).
  key-leak-scan:
    name: key-leak-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: No key in any file a full test run wrote
        run: scripts/key-leak-scan.sh

  # Why: the browser extension compiles these two crates to WebAssembly; build them now so that path never rots.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build aralo-engine and aralo-template for wasm32
        run: cargo build -p aralo-engine -p aralo-template --target wasm32-unknown-unknown

  # Why: the workspace declares `rust-version`; prove it still builds there. Keep in step with Cargo.toml.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Check the workspace on the minimum supported Rust version
        run: cargo check --workspace

  # Why: the keystroke budget. The bench binary asserts on_key p99 < 1 ms with 10,000 abbreviations and exits non-zero on a breach.
  bench:
    name: bench (on_key gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: on_key p99 gate
        run: cargo bench -p aralo-engine

  # Why: the protocol checks against real model servers, not only the recorded streams the mock replays
  # (plan 7.4). Each server runs in a container with a small model, and fails the job if a required check
  # fails. The evaluation set runs too, and is only reported: a model this small is expected to miss some.
  # The report is kept as an artifact; a committed copy goes into docs/compatibility.md.
  conformance:
    name: conformance (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: Ollama
            report: ollama-qwen2.5-0.5b
            base_url: http://127.0.0.1:11434/v1
            model: qwen2.5:0.5b
          - server: llama.cpp
            report: llama.cpp-qwen2.5-0.5b
            base_url: http://127.0.0.1:8080/v1
            model: qwen2.5-0.5b
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the command line
        run: cargo build -p aralo-cli
      - name: Start Ollama, and pull the model
        if: matrix.server == 'Ollama'
        run: |
          docker run --detach --name model-server --publish 127.0.0.1:11434:11434 ollama/ollama:0.11.4
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          docker exec model-server ollama pull "${{ matrix.model }}"
      # llama.cpp publishes its server image under build numbers only; the log records which one ran.
      - name: Start llama.cpp's server, with the model
        if: matrix.server == 'llama.cpp'
        run: |
          docker run --detach --name model-server --publish 127.0.0.1:8080:8080 \
            ghcr.io/ggml-org/llama.cpp:server \
            --hf-repo Qwen/Qwen2.5-0.5B-Instruct-GGUF --hf-file qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --alias "${{ matrix.model }}" --host 0.0.0.0 --port 8080 --ctx-size 8192
          # /health answers 200 once the model is downloaded and loaded.
          for _ in $(seq 300); do curl -fsS http://127.0.0.1:8080/health && break; sleep 2; done
          echo
          curl -fsS http://127.0.0.1:8080/props | python3 -c 'import json, sys; print(json.load(sys.stdin).get("build_info", ""))' || true
      - name: Run the conformance suite
        env:
          ARALO_STATE: ${{ runner.temp }}/state
        run: |
          mkdir -p reports
          target/debug/aralo ai on
          target/debug/aralo ai add "${{ matrix.server }}" --base-url "${{ matrix.base_url }}" --model "${{ matrix.model }}"
          target/debug/aralo conformance --profile "${{ matrix.server }}" --evaluation \
            --report "reports/${{ matrix.report }}.json"
      - name: The report
        if: always()
        run: cat reports/*.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.report }}
          path: reports/
          if-no-files-found: ignore
      - name: The server's log
        if: failure()
        run: docker logs model-server 2>&1 | tail -n 200

  # Why: the Swift shell must keep building against the generated bridge: XCFramework, Swift bindings, xcodegen project, SwiftLint, XCTest.
  macos-app:
    name: macos-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The app is a universal binary (ADR-0010), so the XCFramework needs both slices.
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install xcodegen and SwiftLint
        run: brew install xcodegen swiftlint
      - name: Build the XCFramework and Swift bindings, generate the Xcode project
        run: make bootstrap
      - name: SwiftLint
        run: make lint-swift
      - name: Swift tests
        run: make test-swift
