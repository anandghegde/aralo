# Builds, checks and publishes a release of the Mac app (plan section 10, task 5.5).
#
# A tag v1.2.3 makes a signed release: Developer ID, hardened runtime, notarised
# and stapled, in a DMG, with the Sparkle appcast, the signed data tables, the
# SBOM, the Homebrew cask and SHA256SUMS, all on a GitHub release.
#
# Without the signing secrets (a fork, a pull request, or before they are set)
# the same workflow runs scripts/release.sh --dry-run: ad hoc signature, no
# notarisation, keys made for the run. Every other step is the same, and
# scripts/verify-release.sh checks the result the same way. A dry run is never
# published. docs/releasing.md says how to make each secret.
#
# Actions are pinned by commit here, not by tag: this workflow holds the
# signing identity.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (a dry run unless the secrets are set; only a tag publishes)"
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.sh
      - scripts/verify-release.sh
      - scripts/sign-data.sh
      - packaging/**
      - apps/macos/project.yml
      - apps/macos/Support/**
      - data/keys/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Why: a release is built by a script anyone can run, and checked before it is published (plan section 10).
  build:
    name: build (${{ needs.mode.outputs.signed == 'true' && 'signed' || 'dry run' }})
    needs: mode
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The build number is the number of commits.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # A universal app (ADR-0010).
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Install xcodegen and OpenSSL 3
        run: brew install xcodegen openssl@3

      # The certificate goes into a keychain made for this job, removed at the end.
      - name: Import the Developer ID certificate
        if: needs.mode.outputs.signed == 'true'
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # The job's keychain first, then the ones already in the search list.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          printf '%s' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          echo "ARALO_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"

      - name: Build the release
        id: release
        env:
          ARALO_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          ARALO_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ARALO_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DATA_TABLE_SIGNING_KEY: ${{ secrets.DATA_TABLE_SIGNING_KEY }}
          ARALO_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.mode.outputs.signed }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          args=()
          [[ "$SIGNED" == true ]] || args+=(--dry-run)
          [[ -z "$INPUT_VERSION" ]] || args+=(--version "$INPUT_VERSION")
          scripts/release.sh "${args[@]}"
          echo "version=$(sed -n 's/^version=//p' dist/release.env)" >>"$GITHUB_OUTPUT"

      - name: Check the release
        env:
          SIGNED: ${{ needs.mode.outputs.signed }}
        run: |
          if [[ "$SIGNED" == true ]]; then scripts/verify-release.sh dist; else scripts/verify-release.sh --dry-run dist; fi

      # The cask, installed from a tap made here, pointing at the DMG just built.
      - name: brew install --cask, from the cask this release made
        run: |
          brew tap-new --no-git aralo/local
          tap="$(brew --repository aralo/local)"
          mkdir -p "$tap/Casks"
          dmg="$PWD/dist/$(sed -n 's/^dmg=//p' dist/release.env)"
          sed "s|^  url .*|  url \"file://$dmg\"|" dist/aralo.rb >"$tap/Casks/aralo.rb"
          brew install --cask aralo/local/aralo
          test -d /Applications/Aralo.app
          codesign --verify --strict --deep /Applications/Aralo.app
          brew uninstall --cask aralo/local/aralo
          test ! -d /Applications/Aralo.app

      - name: The unsigned bundle's hash
        run: |
          {
            echo "### Aralo ${{ steps.release.outputs.version }}"
            echo
            echo "Unsigned bundle SHA-256: \`$(cat dist/unsigned-bundle.sha256)\`"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.mode.outputs.signed == 'true' && 'signed' || 'dry-run' }}
          path: dist/
          if-no-files-found: error

      - name: Remove the keychain and the notary key
        if: always() && needs.mode.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Why: signing needs every secret; without them this is a dry run, and a dry run is never published.
  mode:
    name: mode
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - id: mode
        env:
          HAVE_SECRETS: >-
            ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.DEVELOPER_ID_CERT_PASSWORD != ''
            && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_API_KEY_P8 != ''
            && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != ''
            && secrets.SPARKLE_ED_PRIVATE_KEY != '' && secrets.DATA_TABLE_SIGNING_KEY != '' }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$HAVE_SECRETS" == true && "$EVENT" != pull_request ]]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Dry run: the signing secrets are not all set, or this is a pull request."
          fi
          if [[ "$REF_TYPE" == tag && "$HAVE_SECRETS" != true ]]; then
            echo "::error::A tag was pushed, but the signing secrets are not set. Nothing is published."
            exit 1
          fi

  # Why: only a signed build from a tag is published, and only once it has been checked.
  publish:
    name: publish
    needs: [mode, build]
    if: github.ref_type == 'tag' && needs.mode.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-signed
          path: dist
      - name: Check the tag is the version built
        run: test "v${{ needs.build.outputs.version }}" == "${{ github.ref_name }}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Unsigned bundle SHA-256: \`$(cat dist/unsigned-bundle.sha256)\`"
            echo
            echo "A build of this tag should give the same hash: see docs/releasing.md."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "Aralo ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag \
            dist/Aralo-*.dmg dist/appcast.xml dist/Aralo-*.cdx.json dist/aralo.rb dist/SHA256SUMS \
            dist/unsigned-bundle.sha256 dist/unsigned-bundle.files.txt \
            dist/data/apps.toml dist/data/apps.toml.sig
      # The tap is its own repository; a pull request there, with the cask this release made.
      - name: Open the cask pull request on the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || 'anandghegde/homebrew-aralo' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the cask is on the release as aralo.rb."
            exit 0
          fi
          gh repo clone "$TAP" tap -- --depth 1
          mkdir -p tap/Casks
          cp dist/aralo.rb tap/Casks/aralo.rb
          cd tap
          git checkout -b "aralo-$VERSION"
          git add Casks/aralo.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "aralo $VERSION"
          git push origin "aralo-$VERSION"
          gh pr create --title "aralo $VERSION" --body "The cask from the $VERSION release." --head "aralo-$VERSION"
